# canvas-mcp self-hosted multi-user deployment (Entra ID sign-in + a separate Canvas token per user).
#
# Deploy without cloning the repository:
#   mkdir -p /opt/canvas-mcp && cd /opt/canvas-mcp
#   curl -fsSLO https://raw.githubusercontent.com/KKazuhaK/canvas-mcp/uci-student/deploy/selfhost/docker-compose.yml
#   curl -fsSL https://raw.githubusercontent.com/KKazuhaK/canvas-mcp/uci-student/deploy/selfhost/env.example -o .env
#   chmod 600 .env
#   # Edit .env and fill in every setting marked "Required." (see README.md)
#   docker compose up -d
#   docker compose logs -f
#
# The full steps (Entra app registration, reverse proxy, Cloudflare, the claude.ai
# connector) are in deploy/selfhost/README.md.

services:
  canvas-mcp:
    # Image channels:
    #   :latest    the latest stable release (recommended, the default). It exists only
    #              after a stable tag v<x.y.z>-uci.<n> (for example v1.13.0-uci.1) has been
    #              pushed; before the first stable tag is published, pulling it fails with
    #              "manifest unknown", so use :edge until then.
    #   :beta      the latest build of any kind (including pre-releases)
    #   :edge      every commit on the uci-student branch (newest, least stable)
    #   :<version> pin to one version, for example :1.13.0-uci.1
    image: ghcr.io/kkazuhak/canvas-mcp:latest
    container_name: canvas-mcp
    restart: unless-stopped
    # Every `docker compose up -d` pulls the image the chosen tag points to again.
    pull_policy: always

    # All settings and secrets live in .env (chmod 600); do not put them in this file.
    env_file:
      - .env

    # Bound to the loopback address only: external traffic must go through a reverse proxy (nginx / Caddy) that terminates TLS.
    ports:
      - "127.0.0.1:8819:8819"

    # /data holds the encrypted Canvas token store, the OAuth proxy state and the audit log.
    volumes:
      - canvas-mcp-data:/data
      # Optional: put the OAuth proxy state in a separate volume so it is kept apart
      # from the Canvas token store (see "Disk and abuse protection" in the README).
      # To use it, uncomment the line below and also the canvas-mcp-oauth volume at
      # the end of the file:
      #   - canvas-mcp-oauth:/data/fastmcp

    # Hardening: read-only root filesystem, an in-memory /tmp, and no extra privileges.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Exactly 1 replica is supported: confirmation tokens, the course cache and the
    # rate-limit counters all live in process memory, so do not scale it out with
    # `deploy.replicas`, `docker compose up --scale` or a load balancer.

volumes:
  # Set the volume name explicitly. Without name, Compose would create it as
  # <project-name>_canvas-mcp-data (canvas-mcp_canvas-mcp-data when the directory
  # is /opt/canvas-mcp), and the `canvas-mcp-data` used by the backup and restore
  # commands in the README would point at a newly created empty volume: the backup
  # would be empty and a restore would write into a volume the service never uses,
  # with no error at all.
  canvas-mcp-data:
    name: canvas-mcp-data
  # canvas-mcp-oauth:
  #   name: canvas-mcp-oauth

