name: Canvas MCP Enhancement Testing

on:
  push:
    branches: [ main, development, selfhost, 'feature/**', 'fix/**', 'ci/**' ]
  pull_request:
    branches: [ main, selfhost ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    - name: Install Ruff
      run: python -m pip install ruff

    - name: Run Ruff
      run: ruff check src/ tests/

    - name: Install mypy
      # Read the constraint from pyproject instead of repeating it. A literal
      # here silently drifts: it said "<2" while pyproject said "<3", so CI
      # would have kept type-checking on mypy 1.x forever while contributors
      # running `uv sync` got 2.x — the gate asserting a version nobody uses.
      run: |
        # The data layer and its PostgreSQL driver are optional extras; mypy has to see them.
        python -m pip install -e ".[selfhost,postgres]"
        CONSTRAINT=$(python - <<'PY'
        import tomllib
        with open("pyproject.toml", "rb") as fh:
            groups = tomllib.load(fh)["dependency-groups"]["dev"]
        specs = [d for d in groups if isinstance(d, str) and d.startswith("mypy")]
        if len(specs) != 1:
            raise SystemExit(f"expected exactly one mypy spec in dependency-groups.dev, found {specs}")
        print(specs[0])
        PY
        )
        echo "Installing $CONSTRAINT"
        python -m pip install "$CONSTRAINT"

    - name: Run mypy
      run: mypy src/

  test-code-api:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install TypeScript dependencies
      run: npm ci
    - name: Build and test code API
      run: npm run build && npm test

  # The React account UI (web/). Everything is pinned: Node by exact version, the
  # action by commit SHA, the packages by package-lock.json. `npm ci` installs the
  # lock file as written and --ignore-scripts keeps third-party install scripts
  # from running. check:dist asserts the production build has no inline script, no
  # remote URL, no eval and none of the dev-only mock server.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24.19.0'
        cache: npm
        cache-dependency-path: web/package-lock.json
    - name: Install dependencies
      run: npm ci --ignore-scripts
    - name: Lint
      run: npm run lint
    - name: Typecheck
      run: npm run typecheck
    - name: Test
      run: npm test
    - name: Build
      run: npm run build
    - name: Check the production build
      run: npm run check:dist

  verify-confirmation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install pinned formal-verification tools
      run: |
        curl --fail --location --retry 3 -o "$RUNNER_TEMP/lean.tar.zst" https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst
        echo "6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe  $RUNNER_TEMP/lean.tar.zst" | sha256sum --check
        tar --no-same-owner --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/lean-4.19.0-linux/bin" >> "$GITHUB_PATH"
        curl --fail --location --retry 3 -o "$RUNNER_TEMP/tla2tools.jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
        # verify/run.py checks the pinned jar digest before execution.
    - name: Prove the repaired machine and reproduce original counterexamples
      run: TLA_JAR="$RUNNER_TEMP/tla2tools.jar" python verify/run.py

  # Runs the WHOLE suite on every supported interpreter. pyproject declares
  # requires-python = ">=3.11" (3.10 dropped ahead of its 2026-10-31 EOL, #315),
  # so every version in the matrix is a supported target and a version-specific
  # break on the oldest one is invisible on a newer-only runner.
  test:
    runs-on: ubuntu-latest
    env:
      # FastMCP 4 temporarily bridges MCP SDK v1 camelCase attribute reads.
      # Keep the bridge off in CI so new code must use the v2 snake_case API.
      FASTMCP_MCP_CAMELCASE_COMPAT: "false"
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Full history: test_acceptance_replay_real_history replays the
        # closing-keyword checker over every real commit message. The default
        # shallow checkout has no `main` and no old commits, so the replay would
        # skip -- and a validator that only ever sees its own fixtures has not
        # earned its place.
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    # Real sandbox tests require Node's permission model and type stripping.
    - name: Set up Node.js 22
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # The documents extra (pypdf, python-pptx, python-docx) lets the
        # read_course_file_text extraction tests run instead of skipping.
        # The selfhost and postgres extras (SQLAlchemy, Alembic, psycopg) are what the
        # self-hosted data-layer tests import; the upstream modes never need them.
        pip install -e ".[documents,selfhost,postgres]"
        # pyyaml is needed by the workflow-permission policy tests. They use
        # importorskip, so omitting it makes them skip silently in the one job
        # branch protection actually requires — passing green while the check
        # they encode is never run.
        pip install pytest pytest-asyncio pyyaml respx

    - name: Run the test suite
      run: pytest tests/ -q

  # The same full suite on Windows, where a local stdio server often runs and
  # where things Linux never exercises break: an open file cannot be deleted,
  # symlinks need a privilege, `python3` may be the Store alias, and the
  # default text encoding is the ANSI code page rather than UTF-8.
  test-windows:
    runs-on: windows-latest
    env:
      FASTMCP_MCP_CAMELCASE_COMPAT: "false"
      # UTF-8 mode for the interpreter and the Pythons it spawns, so stdio and
      # files opened without an explicit encoding do not use the ANSI code page.
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Full history, for the same closing-keyword replay as the Linux job.
        fetch-depth: 0

    - name: Set up Python 3.14
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14'

    # Real sandbox tests require Node's permission model and type stripping.
    - name: Set up Node.js 22
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[documents,selfhost,postgres]"
        python -m pip install pytest pytest-asyncio pyyaml respx

    - name: Run the test suite
      run: python -m pytest tests/ -q

  # The same full suite on Linux, installed strictly from uv.lock instead of the
  # newest versions pyproject.toml allows. The matrix above answers "does the
  # code work with whatever pip resolves today"; this answers "does it work with
  # the exact dependency set that ships". Dockerfile.selfhost installs from the
  # same lock, with the same uv and Python, so a locked version that differs from
  # the latest resolvable one (fastmcp 4.0.3 when this
  # job was added) is otherwise never exercised. --locked fails the job when
  # uv.lock is stale against pyproject.toml instead of quietly re-resolving.
  test-locked:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FASTMCP_MCP_CAMELCASE_COMPAT: "false"
      # One source of truth for the interpreter: setup-python installs it and uv
      # is told to use exactly it. With downloads off, uv fails rather than
      # fetching (or falling back to the runner's system Python) and running the
      # suite on an interpreter nobody asked for. 3.14 is what the self-hosted
      # image ships.
      UV_PYTHON: "3.14"
      UV_PYTHON_DOWNLOADS: never

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Full history, for the same closing-keyword replay as the other test
        # jobs (test_acceptance_replay_real_history skips on a shallow clone).
        fetch-depth: 0

    - name: Set up Python ${{ env.UV_PYTHON }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ env.UV_PYTHON }}

    # Real sandbox tests require Node's permission model and type stripping.
    - name: Set up Node.js 22
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'

    - name: Set up uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        # Same uv as Dockerfile.selfhost, so lock handling is identical.
        version: '0.12.22'
        # No cache: nothing may stand between uv.lock and what gets installed.
        enable-cache: false

    - name: Install from uv.lock
      # The documents extra and the dev group (pytest, pytest-asyncio, pyyaml,
      # respx, and the document parsers) match what the other test jobs install,
      # so the extraction tests run instead of skipping.
      run: uv sync --locked --extra documents --extra selfhost --extra postgres --group dev

    - name: Run the test suite
      run: uv run --locked pytest tests/ -q

  # The self-hosted tests against a real PostgreSQL server. The default jobs above run
  # them on SQLite; this one runs EVERY store-backed test, the whole-server stacks and
  # the two-connection race tests on PostgreSQL (CANVAS_MCP_TEST_BACKEND=postgres).
  # tests/conftest.py aborts the run, it does not skip, when the server is unreachable,
  # so this job cannot pass without exercising PostgreSQL. The image is pinned by tag
  # and digest and is the one deploy/selfhost/docker-compose.postgres.yml deploys
  # (tests/test_selfhost_compose_postgres.py keeps the two identical). The password is
  # a throwaway that only exists inside this job's private service container.
  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dependencies: [latest, locked]
    permissions:
      contents: read
    env:
      FASTMCP_MCP_CAMELCASE_COMPAT: "false"
      UV_PYTHON: "3.14"
      UV_PYTHON_DOWNLOADS: never
      CANVAS_MCP_TEST_BACKEND: postgres
      CANVAS_MCP_TEST_DATABASE_URL: postgresql+psycopg://canvas:ci-only-not-a-secret@127.0.0.1:5432/canvas_mcp_test
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: canvas
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: canvas_mcp_test
          POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U canvas -d canvas_mcp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ env.UV_PYTHON }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ env.UV_PYTHON }}

    - name: Set up uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: '0.12.22'
        enable-cache: false

    - name: Install from uv.lock
      if: matrix.dependencies == 'locked'
      run: uv sync --locked --extra documents --extra selfhost --extra postgres --group dev

    - name: Install latest allowed dependencies
      if: matrix.dependencies == 'latest'
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[documents,selfhost,postgres]"
        python -m pip install pytest pytest-asyncio pyyaml respx

    - name: Verify account, reminder and migration paths before the full suite
      env:
        TEST_DEPENDENCIES: ${{ matrix.dependencies }}
      run: |
        set -euo pipefail
        checks=(tests/selfhost/test_v1_migrate.py tests/selfhost/test_transfer_v1.py tests/selfhost/test_site_url.py tests/selfhost/login/test_account_login_policy.py tests/selfhost/login/test_account_policy_api.py tests/selfhost/test_token_reminders.py tests/selfhost/test_canvas_expiry.py)
        if [[ "$TEST_DEPENDENCIES" == locked ]]; then
          uv run --locked pytest "${checks[@]}" -q -p no:cacheprovider
        else
          python -m pytest "${checks[@]}" -q -p no:cacheprovider
        fi

    - name: Run the lock-pinned self-hosted tests on PostgreSQL
      if: matrix.dependencies == 'locked'
      run: >-
        uv run --locked pytest
        tests/selfhost tests/test_multiuser_e2e.py tests/test_fastmcp_compat.py
        -q -p no:cacheprovider

    - name: Run the latest-dependency self-hosted tests on PostgreSQL
      if: matrix.dependencies == 'latest'
      run: >-
        python -m pytest
        tests/selfhost tests/test_multiuser_e2e.py tests/test_fastmcp_compat.py
        -q -p no:cacheprovider

  # Aggregator. Branch protection requires a check literally named
  # "test-enhancements", and a matrix job publishes per-version names
  # ("test (3.11)"), which would leave the required check permanently pending
  # and block every PR. This gate keeps the required name while making it mean
  # "the full suite passed on every supported Python, on Linux and Windows, and
  # on the exact versions in uv.lock, the code API passed, and the web UI built
  # and passed its checks".
  test-enhancements:
    runs-on: ubuntu-latest
    needs: [test, test-windows, test-locked, test-postgres, test-code-api, verify-confirmation, web]
    if: always()

    steps:
    - name: Require Python (Linux, Windows, locked and PostgreSQL), code API, web UI, and confirmation proofs to have succeeded
      run: |
        echo "matrix result: ${{ needs.test.result }}"
        echo "windows result: ${{ needs.test-windows.result }}"
        echo "locked result: ${{ needs.test-locked.result }}"
        echo "postgres result: ${{ needs.test-postgres.result }}"
        echo "web result: ${{ needs.web.result }}"
        if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.test-windows.result }}" != "success" ] || [ "${{ needs.test-locked.result }}" != "success" ] || [ "${{ needs.test-postgres.result }}" != "success" ] || [ "${{ needs.test-code-api.result }}" != "success" ] || [ "${{ needs.verify-confirmation.result }}" != "success" ] || [ "${{ needs.web.result }}" != "success" ]; then
          echo "::error::Python (Linux, Windows, locked or PostgreSQL), code API, web UI, or confirmation verification did not succeed."
          exit 1
        fi
        echo "## Canvas MCP test results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Full suite passed on Ubuntu with Python 3.11, 3.12, 3.13 and 3.14, on Windows with Python 3.14, on Ubuntu with Python 3.14 against the exact dependency versions in uv.lock, and the self-hosted tests also passed against PostgreSQL 18 with both latest allowed and lock-pinned dependencies (the test-postgres matrix). The web UI (web/) passed lint, typecheck, tests, build and the dist checks." >> $GITHUB_STEP_SUMMARY

  selfhost-image-verify:
    name: Verify self-host image (${{ matrix.platform }})
    if: ${{ github.repository == 'KKazuhaK/canvas-mcp' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Compute build timestamp
        id: stamp
        run: echo "built_at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - name: Build the reviewed image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.selfhost
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: canvas-mcp:verify
          build-args: |
            BUILD_VERSION=ci-${{ github.sha }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.stamp.outputs.built_at }}
      - name: Exercise the native v1 image contract
        run: bash deploy/selfhost/smoke-test.sh canvas-mcp:verify
      - name: Exercise the same image on the pinned PostgreSQL target
        env:
          SMOKE_NETWORK: canvas-mcp-verify-db
          SMOKE_DATABASE_URL: postgresql+psycopg://canvas:smoke-only-database-password@postgres:5432/canvas_mcp
        run: |
          set -euo pipefail
          trap 'docker rm -f canvas-mcp-verify-postgres >/dev/null 2>&1 || true; docker network rm "$SMOKE_NETWORK" >/dev/null 2>&1 || true' EXIT
          PG_IMAGE="$(sed -n 's/^    image: //p' deploy/selfhost/docker-compose.postgres.yml)"
          test -n "$PG_IMAGE"
          # A throwaway bridge allows the host-side HTTP smoke client to reach
          # the published loopback app port. PostgreSQL publishes no host port.
          docker network create "$SMOKE_NETWORK" >/dev/null
          docker run --rm -d --name canvas-mcp-verify-postgres --network "$SMOKE_NETWORK" \
            --network-alias postgres -e POSTGRES_USER=canvas -e POSTGRES_DB=canvas_mcp \
            -e POSTGRES_PASSWORD=smoke-only-database-password \
            -e POSTGRES_INITDB_ARGS='--encoding=UTF8 --locale=C' "$PG_IMAGE" >/dev/null
          ready=false
          for ((i=0; i<60; i++)); do
            if docker exec canvas-mcp-verify-postgres pg_isready -U canvas -d canvas_mcp; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          bash deploy/selfhost/smoke-test.sh canvas-mcp:verify
